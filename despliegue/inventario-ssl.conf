<VirtualHost *:443>
    ServerName inventario.serenaesteve.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/inventario.serenaesteve.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/inventario.serenaesteve.com/privkey.pem

    # El inventario toma la IP real de X-Forwarded-For (la añade mod_proxy)
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8095/
    ProxyPassReverse / http://127.0.0.1:8095/
    ProxyTimeout 60

    ErrorLog ${APACHE_LOG_DIR}/inventario-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/inventario-ssl-access.log combined
</VirtualHost>
