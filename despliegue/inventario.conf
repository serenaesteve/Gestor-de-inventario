# Gestor de inventario en inventario.serenaesteve.com: Apache pone el HTTPS y reenvía a 127.0.0.1:8095.
<VirtualHost *:80>
    ServerName inventario.serenaesteve.com

    # La verificación de Let's Encrypt se sirve aquí; todo lo demás va a HTTPS.
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://inventario.serenaesteve.com%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/inventario-error.log
    CustomLog ${APACHE_LOG_DIR}/inventario-access.log combined
</VirtualHost>
